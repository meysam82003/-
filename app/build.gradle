plugins {
    id 'com.android.application'
}

def tvReleaseKeystore = System.getenv('TV_CURSOR_KEYSTORE_PATH')

android {
    namespace 'io.github.meysam82003.tvcursor'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.meysam82003.tvcursor'
        minSdk 28
        targetSdk 35
        versionCode 5
        versionName '1.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        tvProduction {
            if (tvReleaseKeystore) {
                storeFile file(tvReleaseKeystore)
                storePassword System.getenv('TV_CURSOR_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TV_CURSOR_KEY_ALIAS')
                keyPassword System.getenv('TV_CURSOR_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Without owner's signing secrets, provide an installable PREVIEW
            // build with Android's debug signing key. Never use it in stores.
            signingConfig = tvReleaseKeystore ? signingConfigs.tvProduction : signingConfigs.debug
            minifyEnabled false
        }
    }
}

// Local unit tests; not included in the app APK.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}