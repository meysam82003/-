plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.meysam82003.tvcursor'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.meysam82003.tvcursor'
        minSdk 28
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// Local unit tests; not included in the app APK.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}