name: Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK platform
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-Cursor-v1.3.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
