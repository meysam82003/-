name: Android APK and GitHub Release

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK API 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure optional production signing
        shell: bash
        env:
          TV_CURSOR_KEYSTORE_BASE64: ${{ secrets.TV_CURSOR_KEYSTORE_BASE64 }}
          TV_CURSOR_KEY_ALIAS: ${{ secrets.TV_CURSOR_KEY_ALIAS }}
          TV_CURSOR_KEYSTORE_PASSWORD: ${{ secrets.TV_CURSOR_KEYSTORE_PASSWORD }}
          TV_CURSOR_KEY_PASSWORD: ${{ secrets.TV_CURSOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$TV_CURSOR_KEYSTORE_BASE64" && -n "$TV_CURSOR_KEY_ALIAS" && -n "$TV_CURSOR_KEYSTORE_PASSWORD" && -n "$TV_CURSOR_KEY_PASSWORD" ]]; then
            echo "$TV_CURSOR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tv-cursor-release.jks"
            echo "TV_CURSOR_KEYSTORE_PATH=$RUNNER_TEMP/tv-cursor-release.jks" >> "$GITHUB_ENV"
            echo 'PREVIEW_ONLY=0' >> "$GITHUB_ENV"
          else
            echo 'PREVIEW_ONLY=1' >> "$GITHUB_ENV"
            echo 'No production signing secrets supplied; APK uses Android debug certificate. Preview only.'
          fi

      - name: Run tests and assemble installable APK
        env:
          TV_CURSOR_KEY_ALIAS: ${{ secrets.TV_CURSOR_KEY_ALIAS }}
          TV_CURSOR_KEYSTORE_PASSWORD: ${{ secrets.TV_CURSOR_KEYSTORE_PASSWORD }}
          TV_CURSOR_KEY_PASSWORD: ${{ secrets.TV_CURSOR_KEY_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest assembleRelease assembleDebug

      - name: Check release APK exists
        shell: bash
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Archive installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-Cursor-v1.4.0-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Archive debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-Cursor-v1.4.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release v1.4.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.4.0 >/dev/null 2>&1; then
            echo 'GitHub Release v1.4.0 already exists; leaving its assets unchanged.'
            exit 0
          fi
          args=()
          if [[ "$PREVIEW_ONLY" == '1' ]]; then
            args+=(--prerelease)
          fi
          gh release create v1.4.0 \
            'app/build/outputs/apk/release/app-release.apk#TV-Remote-Cursor-v1.4.0-Android9plus.apk' \
            --target "$GITHUB_SHA" \
            --title 'TV Remote Cursor v1.4.0 — Neon UI' \
            --notes-file RELEASE_NOTES.md \
            "${args[@]}"